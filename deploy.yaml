app: annotate
runtime:
  image: ghcr.io/jakenesler/annotate
  port: 8080
build:
  context: .
  dockerfile: Dockerfile
sizing:
  profile: minimal
  replicas: 1
probes:
  type: http
  path: /health
env:
  REVIEW_ALLOWED_TARGETS: http://10.0.0.225:3000
  REVIEW_PROXY_DOMAIN: 10.0.0.207.nip.io
expose:
  lan: true
  host: annotate.lan
  ip: 10.0.0.207
  port: 80
logging:
  enabled: true
metrics:
  enabled: false
